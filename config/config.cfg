# WebServer Configuration File
# ===========================
# This file contains configuration options for the WebServer
# Modify these values to change server behavior

# Server basic configuration
Config.PORT = 80
Config.ENCODING = 'utf-8'
Config.WWW_ROOT = './WWW'
Config.ERROR_DIR = '/error'
Config.DIR_LISTING = False
Config.LOG_DIR = './log'
Config.LOG_RETENTION_DAYS = None
Config.CONFIG_DIR = "./config"

# Performance settings
Config.THREADS = 32  # waitress worker threads
Config.CONSOLE_LOG = True  # print request logs to console (done in a background thread)
Config.STATIC_MAX_AGE = 3600  # Cache-Control max-age for static files (HTML always 0)

# How pys scripts get a per-thread working directory:
#   'auto'   - Linux: real per-thread cwd via unshare(CLONE_FS) if the system allows it,
#              otherwise (and on Windows/macOS) patch the common file APIs
#   'native' - like auto, but warn loudly if the native method is unavailable
#   'patch'  - always patch the file APIs
Config.CWD_MODE = 'auto'

# Large file download settings (kept for compatibility; send_file handles streaming/Range)
Config.LARGE_FILE_THRESHOLD = 50 * 1024 * 1024  # 50MB threshold for streaming
Config.CHUNK_SIZE = 64 * 1024  # 64KB chunks for streaming

# File type categories
Config.HTML_EXTENSIONS = ['html', 'htm', 'pys']
Config.IMAGE_EXTENSIONS = ['bmp', 'gif', 'jpg', 'png', 'jpeg', 'webp', 'svg', 'ico', 'tif', 'tiff']
Config.VIDEO_EXTENSIONS = ['mp4', 'webm', 'avi', 'mov', 'wmv', 'flv', 'mkv']
Config.AUDIO_EXTENSIONS = ['mp3', 'wav', 'ogg', 'aac', 'flac', 'm4a']
Config.FONT_EXTENSIONS = ['ttf', 'otf', 'woff', 'woff2']
